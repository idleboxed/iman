name: Rust package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust ${{ matrix.rust-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.85.0", stable]

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # IPC fixtures select tmpfs explicitly; executable fixtures need an exec-capable filesystem.
      TMPDIR: /tmp

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12 for child fixtures
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Rust ${{ matrix.rust-version }}
        run: rustup toolchain install "${{ matrix.rust-version }}" --profile minimal --no-self-update
      - name: Check minimal build
        run: cargo +${{ matrix.rust-version }} check --locked --no-default-features --all-targets
      - name: Run default feature tests
        run: cargo +${{ matrix.rust-version }} test --locked --verbose -- --test-threads=1
      - name: Run all feature tests
        run: cargo +${{ matrix.rust-version }} test --locked --all-features --verbose -- --test-threads=1

  arm:
    name: ARMv7 DRM
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C target-cpu=cortex-a7

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Rust and ARMv7 musl
        run: rustup toolchain install stable --profile minimal --target armv7-unknown-linux-musleabihf --no-self-update
      - name: Check DRM and diagnostics on ARMv7
        run: >-
          cargo +stable check --locked --all-targets
          --target armv7-unknown-linux-musleabihf
          --no-default-features --features drm,rgb565,diagnostics
